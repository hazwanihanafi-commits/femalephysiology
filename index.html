ssets/c5_03.webp", "assets/c5_04.webp", "assets/c5_05.webp", "assets/c5_06.webp", "assets/c5_07.webp", "assets/c5_08.webp", "assets/c5_09.webp", "assets/c5_10.webp", "assets/c5_11.webp", "assets/c5_12.webp", "assets/c5_13.webp", "assets/c5_14.webp", "assets/c5_15.webp", "assets/c5_16.webp", "assets/c5_17.webp", "assets/c5_18.webp", "assets/c5_19.webp", "assets/c5_20.webp"], ["assets/c6_01.webp", "assets/c6_02.webp", "assets/c6_03.webp", "assets/c6_04.webp", "assets/c6_05.webp", "assets/c6_06.webp", "assets/c6_07.webp", "assets/c6_08.webp", "assets/c6_09.webp", "assets/c6_10.webp", "assets/c6_11.webp", "assets/c6_12.webp", "assets/c6_13.webp", "assets/c6_14.webp", "assets/c6_15.webp", "assets/c6_16.webp", "assets/c6_17.webp", "assets/c6_18.webp", "assets/c6_19.webp", "assets/c6_20.webp", "assets/c6_22.webp", "assets/c6_23.webp", "assets/c6_24.webp", "assets/c6_25.webp", "assets/c6_26.webp", "assets/c6_27.webp", "assets/c6_28.webp", "assets/c6_29.webp", "assets/c6_30.webp", "assets/c6_31.webp", "assets/c6_32.webp", "assets/c6_33.webp", "assets/c6_34.webp", "assets/c6_35.webp", "assets/c6_36.webp", "assets/c6_37.webp", "assets/c6_38.webp", "assets/c6_39.webp", "assets/c6_40.webp", "assets/c6_41.webp"], ["assets/c7_01.webp", "assets/c7_02.webp", "assets/c7_03.webp", "assets/c7_04.webp", "assets/c7_05.webp", "assets/c7_06.webp", "assets/c7_07.webp", "assets/c7_08.webp", "assets/c7_09.webp", "assets/c7_10.webp", "assets/c7_11.webp", "assets/c7_12.webp", "assets/c7_13.webp", "assets/c7_14.webp", "assets/c7_15.webp", "assets/c7_16.webp", "assets/c7_17.webp", "assets/c7_18.webp", "assets/c7_19.webp", "assets/c7_20.webp"], ["assets/c8_01.webp", "assets/c8_02.webp", "assets/c8_03.webp", "assets/c8_04.webp", "assets/c8_05.webp", "assets/c8_06.webp", "assets/c8_07.webp", "assets/c8_08.webp", "assets/c8_09.webp", "assets/c8_10.webp", "assets/c8_11.webp", "assets/c8_12.webp", "assets/c8_13.webp", "assets/c8_14.webp", "assets/c8_15.webp", "assets/c8_16.webp", "assets/c8_17.webp", " const COURSE=['Explain female reproductive, endocrine and exercise physiology across the lifespan, from childhood to healthy ageing.','Analyse the hormonal, cardiovascular, respiratory, metabolic, neuromuscular, skeletal and thermoregulatory mechanisms underlying exercise responses.','Compare exercise-related physiological adaptations across puberty, menstrual cycling, athletic training, pregnancy, postpartum recovery and menopause.','Interpret exercise physiology evidence critically, distinguishing established mechanisms from variable individual outcomes.','Apply physiological reasoning to exercise assessment, safe prescription, clinical cases and appropriate referral decisions.'];
let ch=0,tab='outcomes',pg=0;const $=x=>document.getElementById(x);$('count').textContent=SLIDES.reduce((a,b)=>a+b.length,0)+' uploaded slides · 8 chapters';
function choose(i){ch=i;pg=0;tab='outcomes';render();window.scrollTo(0,0)}function changeTab(t){tab=t;render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));
function render(){ $('title').textContent='Chapter '+(ch+1)+' · '+TITLES[ch];$('intro').textContent='Explore the original uploaded slides, chapter learning outcomes, an interactive teaching simulator and a knowledge check.';$('nav').innerHTML=TITLES.map((x,i)=>`<button class="${i===ch?'active':''}" onclick="choose(${i})"><b>${i+1}. ${x}</b><small>${SLIDES[i].length} slides</small></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='outcomes')renderOutcomes();if(tab==='slides')renderSlides();if(tab==='lab')renderLab();if(tab==='quiz')renderQuiz()}
function cards(a){return `<div class="outcomes">${a.map((x,i)=>`<div class="outcome"><b>LO ${i+1}</b><div>${x}</div></div>`).join('')}</div>`}
function renderOutcomes(){$('content').innerHTML=`<div class="panel"><h2>Course learning outcomes</h2><p>By the end of Physiology of Exercising Females, students should be able to:</p>${cards(COURSE)}</div><div class="panel"><h2>Chapter ${ch+1} learning outcomes</h2>${cards(OUTCOMES[ch])}<div class="controls"><button class="action primary" onclick="changeTab('slides')">Start chapter slideshow →</button></div></div>`}
function renderSlides(){let arr=SLIDES[ch];$('content').innerHTML=`<div class="panel"><div style="color:var(--aqua);font-weight:700">ORIGINAL POWERPOINT · SLIDE ${pg+1} OF ${arr.length}</div><img class="slide" id="slide" src="${arr[pg]}" alt="Chapter ${ch+1}, slide ${pg+1}"><div class="controls"><button class="action" onclick="move(-1)">← Previous</button><span>${pg+1} / ${arr.length}</span><button class="action primary" onclick="move(1)">Next →</button></div><div class="thumbs">${arr.map((s,i)=>`<button class="thumb ${pg===i?'active':''}" onclick="go(${i})"><img loading="lazy" src="${s}" alt="Slide ${i+1}"><small>${i+1}</small></button>`).join('')}</div></div>`}
function go(i){pg=i;renderSlides()}function move(d){pg=Math.max(0,Math.min(SLIDES[ch].length-1,pg+d));renderSlides()}window.addEventListener('keydown',e=>{if(tab==='slides'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}});
const LABS=[
['Cardiac output','Heart rate (beats/min)',60,190,120,'Stroke volume (mL/beat)',35,120,70,(a,b)=>(a*b/1000).toFixed(1),'L/min','Cardiac output = heart rate × stroke volume. This is a general circulatory relationship, not a direct prediction of ovarian hormone effects.'],
['Relative and absolute VO₂peak','Body mass (kg)',20,65,35,'Relative VO₂peak (mL/kg/min)',25,65,43,(a,b)=>(a*b/1000).toFixed(2),'L/min','Absolute VO₂peak depends partly on body size. Comparing children with adults requires careful scaling and maturity context.'],
['Exercise cardiac output','Heart rate (beats/min)',60,200,145,'Stroke volume (mL/beat)',35,120,65,(a,b)=>(a*b/1000).toFixed(1),'L/min','Explore how heart rate and stroke volume contribute to cardiac output; individual puberty-related adaptations vary.'],
['Illustrative menstrual timeline','Cycle day (illustrative 28-day cycle)',1,28,14,'Cycle length (days)',21,35,28,(a,b)=>a<=Math.max(1,b-14)?'Follicular':'Luteal','phase (approx.)','Illustrative calendar model only: ovulation and hormone concentrations cannot be reliably determined from day number alone.'],
['Energy availability','Energy intake (kcal/day)',1000,4500,2500,'Exercise energy expenditure (kcal/day)',0,2000,650,(a,b)=>a-b,'kcal/day remaining','This is intake minus exercise expenditure, NOT energy availability in kcal/kg fat-free mass/day; that calculation also requires fat-free mass. It cannot diagnose RED-S.'],
['Maternal cardiac output','Heart rate (beats/min)',60,160,95,'Stroke volume (mL/beat)',45,125,85,(a,b)=>(a*b/1000).toFixed(1),'L/min','Pregnancy changes haemodynamics, but individual responses vary; values here are hypothetical.'],
['Symptom-guided activity planning','Comfortable walking (minutes)',0,60,15,'Perceived effort (0–10)',0,10,3,(a,b)=>a+' min / RPE '+b,'illustrative activity','Symptoms, function, delivery history and clinical assessment guide progression; elapsed weeks alone do not establish readiness for impact exercise.'],
['Exercise volume explorer','Sessions per week',0,7,3,'Minutes per session',0,90,35,(a,b)=>a*b,'minutes/week','This arithmetic model illustrates weekly exercise volume. Individualise resistance, aerobic and balance exercise to health status, function and symptoms.']];
function renderLab(){let l=LABS[ch];$('content').innerHTML=`<div class="panel"><h2>${l[0]}</h2><p>Move the sliders to explore a physiological relationship.</p><label>${l[1]}: <span id="v1">${l[4]}</span></label><input id="s1" type="range" min="${l[2]}" max="${l[3]}" value="${l[4]}" oninput="update()"><label>${l[5]}: <span id="v2">${l[8]}</span></label><input id="s2" type="range" min="${l[6]}" max="${l[7]}" value="${l[8]}" oninput="update()"><div class="panel"><div class="metric" id="result"></div><span>${l[10]}</span></div><div class="note">${l[11]}</div><div class="controls"><button class="action" onclick="renderLab()">Reset</button><button class="action primary" onclick="changeTab('quiz')">Knowledge check →</button></div></div>`;update()}

const QUIZZES=[['Which sequence best describes the HPO axis?',['Hypothalamus → GnRH → pituitary FSH/LH → ovaries','Ovaries → insulin → kidneys','Heart → FSH → hypothalamus'],0,'GnRH drives pituitary gonadotropin release, which regulates ovarian function.'],['Why can absolute VO₂peak differ between a girl and an adult?',['Body size and maturation affect absolute oxygen uptake','Only estrogen determines VO₂peak','All girls have identical VO₂peak'],0,'Body size, maturity and fitness all influence aerobic measures.'],['Which is most appropriate when comparing adolescent athletes?',['Account for biological maturity and individual variability','Use chronological age alone','Infer maturity from appearance'],0,'Biological maturation differs between individuals of the same age.'],['Can calendar day alone establish ovulation?',['No, phase verification requires more information','Yes, always day 14','Yes, if exercise is intense'],0,'Cycle length and ovulation timing vary.'],['What does a single low-energy calculation establish?',['It is not sufficient to diagnose RED-S','It definitively diagnoses RED-S','It rules out menstrual disorders'],0,'RED-S requires careful clinical assessment and context.'],['What guides exercise decisions during pregnancy?',['Symptoms, clinical context and obstetric guidance','A universal fixed heart-rate limit for everyone','Gestational week alone'],0,'Exercise is individualised and warning signs warrant assessment.'],['What is the best guide to postpartum exercise progression?',['Function, symptoms and clinical history','Exactly six weeks for everyone','Absence of abdominal muscle separation'],0,'Recovery is individual and symptom-guided.'],['What is a key exercise goal after menopause?',['Support strength, bone health and functional capacity','Avoid resistance exercise universally','Assume all symptoms are caused by estrogen alone'],0,'A combined individualised approach supports healthy ageing.']];
function renderQuiz(){let q=QUIZZES[ch];$('content').innerHTML=`<div class="panel"><h2>Chapter ${ch+1} · Knowledge check</h2><p>${q[0]}</p>${q[1].map((x,i)=>`<button class="quizbtn" onclick="check(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}<div id="feedback" class="note" style="display:none"></div></div>`}function check(i){let q=QUIZZES[ch],f=$('feedback');f.style.display='block';f.textContent=(i===q[2]?'✓ Correct. ':'Review your answer. ')+q[3]}
render();</script></body></html>
